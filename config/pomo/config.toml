# pomo configuration — Pomodoro profiles
#
# Usage:  pomo                    -> profile named by default_profile below
#         pomo -p deep            -> profile "deep"
#         pomo -p deep -w 60      -> profile "deep", but 60 min of work
#         pomo -L                 -> list profiles
#         pomo --on-work-start "CMD" --on-work-end "CMD"  -> one-off hooks
#
# Profile keys (minutes, integers > 0):
#   work         length of a work session                (default: 25)
#   short_break  length of the short break                (default: 5)
#   cycles       work sessions before the long break      (default: 4)
#   long_break   length of the long break (optional)      (default: 15)
#
# Hooks: shell commands run when a work period starts / ends
# (in [hooks] for every profile, or inside a profile to override):
#   on_work_start  work starts, and timer resumes during work
#                  (default: "playerctl -a -p mpv play")
#   on_work_end    work ends, timer paused during work, or pomo quit during work
#                  (default: "playerctl -a -p mpv pause")
#   "" = do nothing.
#
# Environment variables available to hooks:
#   POMO_EVENT     start | resume (start hook)  ·  end | pause | quit (end hook)
#   POMO_PROFILE   profile name
#   POMO_DONE      number of completed pomodoros
#   POMO_CYCLES    work sessions before the long break
#   POMO_WORK_MIN  work length in minutes

default_profile = "classic"

# UI language: "auto" (system locale), "en" or "fr"
language = "auto"

[hooks]
on_work_start = "playerctl -a -p mpv play"
on_work_end = "playerctl -a -p mpv pause"

[profiles.classic]
work = 25
short_break = 5
cycles = 4
long_break = 15

[profiles.deep]
work = 50
short_break = 10
cycles = 3
long_break = 30

[profiles.short]
work = 15
short_break = 3
cycles = 4

# Example: no music, but log each finished session
# (except when the timer is merely paused)
[profiles.silent]
work = 25
short_break = 5
cycles = 4
on_work_start = ""
on_work_end = '[ "$POMO_EVENT" = pause ] || echo "$(date "+%F %T") end ($POMO_EVENT) - $POMO_PROFILE" >> ~/.local/state/pomo.log'
